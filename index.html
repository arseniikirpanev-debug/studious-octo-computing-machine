<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>Genshin RPG Mobile</title>
    <style>
        body{margin:0;overflow:hidden;background:#111;touch-action:none;user-select:none;-webkit-user-select:none;font-family:sans-serif;}
        canvas{display:block;width:100vw;height:100vh;}
        .b{position:absolute;width:55px;height:55px;border-radius:50%;color:#fff;font:bold 20px sans-serif;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);border:2px solid #d3bc8e;box-shadow:0 0 8px rgba(0,0,0,0.5);}
        #a{right:20px;bottom:110px;width:70px;height:70px;background:rgba(244,208,104,0.4);font-size:26px;}
        #e{right:100px;bottom:125px;background:rgba(0,255,204,0.3);}
        #q{right:105px;bottom:50px;background:rgba(150,255,255,0.2);border-color:#00ffcc;}
        #wpn{position:absolute;top:20px;right:20px;padding:8px 12px;background:rgba(0,0,0,0.7);border:1px solid #d3bc8e;border-radius:6px;color:#fff;font-size:12px;text-align:center;}
        .cd{font-size:10px;color:#ff3333;display:block;}
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="a" class="b">⚔️</div>
    <div id="e" class="b">🌀<span id="ec"></span></div>
    <div id="q" class="b">🌪️<span id="qc"></span></div>
    <div id="wpn">Меч: Lvl <span id="wl">1</span><br><span id="wcost">⚡ Улучшить (0/5 Руды)</span></div>
        <script>
        const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
        let w=canvas.width=window.innerWidth,h=canvas.height=window.innerHeight;
        window.onresize=()=>{w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;};

        const joy={a:false,sx:0,sy:0,cx:0,cy:0,r:45},mv={x:0,y:0};
        const env=[],enemies=[],dmgs=[],parts=[],vortexes=[],items=[];
        
        const p={x:w/2,y:h/2+100,r:15,s:3.8,hp:100,mHp:100,energy:0,mEnergy:100,eCd:0,qCd:0,aCd:0,dx:0,dy:1,wl:1,ore:0};
        
        let isDungeon = false, t = 0;
        const statue = {x: 100, y: 100, r: 25};
        const dungeonPortal = {x: w/2, y: h/2 - 50, r: 35};

        function initMap() {
            env.length = 0;
            if(!isDungeon) {
                for(let i=0;i<12;i++) env.push({x:Math.random()*w,y:Math.random()*h,t:Math.random()>0.3?'t':'r',r:12+Math.random()*12});
            }
        }
        initMap();

        window.addEventListener('touchstart',e=>{
            for(let touch of e.changedTouches){
                if(touch.clientX<w/2){joy.a=true;joy.sx=joy.cx=touch.clientX;joy.sy=joy.cy=touch.clientY;}
            }
        });
        window.addEventListener('touchmove',e=>{
            for(let touch of e.touches){
                if(joy.a&&touch.clientX<w/2){
                    let dx=touch.clientX-joy.sx,dy=touch.clientY-joy.sy,d=Math.hypot(dx,dy);
                    if(d>joy.r){dx=(dx/d)*joy.r;dy=(dy/d)*joy.r;}
                    joy.cx=joy.sx+dx;joy.cy=joy.sy+dy;
                    mv.x=dx/joy.r;mv.y=dy/joy.r;
                }
            }
        });
        const stop=()=>{joy.a=false;mv.x=mv.y=0;};
        window.addEventListener('touchend',stop);window.addEventListener('touchcancel',stop);

        document.getElementById('a').addEventListener('touchstart',e=>{e.preventDefault();atk();});
        document.getElementById('e').addEventListener('touchstart',e=>{e.preventDefault();bstE();});
        document.getElementById('q').addEventListener('touchstart',e=>{e.preventDefault();bstQ();});
        
        document.getElementById('wpn').addEventListener('touchstart',e=>{
            e.preventDefault();
            let cost = p.wl * 5;
            if(p.ore >= cost) {
                p.ore -= cost;
                p.wl++;
                document.getElementById('wl').innerText = p.wl;
                document.getElementById('wcost').innerText = `⚡ Улучшить (0/${p.wl*5} Руды)`;
                dmg(p.x, p.y-30, "Weapon UP!", "#f4d068");
            }
        });

        function atk(){
            if(p.aCd>0||p.hp<=0) return; p.aCd=12;
            let sx=p.x+p.dx*32, sy=p.y+p.dy*32;
            let colors = ['#fff','#f4d068','#00ffcc','#ff33cc'];
            pt(sx,sy,colors[Math.min(p.wl-1, 3)],6);
            
            enemies.forEach(e=>{
                if(Math.hypot(e.x-sx,e.y-sy)<45){
                    let damage = 8 + p.wl * 4;
                    e.hp-=damage; dmg(e.x,e.y-10,damage, e.c);
                    e.x+=p.dx*15; e.y+=p.dy*15;
                    p.energy = Math.min(p.mEnergy, p.energy + 8);
                }
            });
        }

        function bstE(){
            if(p.eCd>0||p.hp<=0)return; p.eCd=360;
            vortexes.push({x:p.x, y:p.y, r:90, duration:90, pull:true, c:'rgba(0,255,204,0.15)'});
            pt(p.x,p.y,'#00ffcc',25);
        }

        function bstQ(){
            if(p.energy<p.mEnergy||p.hp<=0)return; p.energy=0;
            let ang = Math.atan2(p.dy, p.dx);
            vortexes.push({x:p.x, y:p.y, r:140, duration:240, pull:true, vx:Math.cos(ang)*2.5, vy:Math.sin(ang)*2.5, c:'rgba(150,255,255,0.2)'});
        }

        function dmg(x,y,v,c){dmgs.push({x,y,v,c,a:1});}
        function pt(x,y,c,n){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c,a:1});}}

        setInterval(()=>{
            if(enemies.length >= (isDungeon?8:4) || p.hp<=0) return;
            let types = isDungeon ? [{c:'#ff4d4d',hp:50},{c:'#3399ff',hp:60}] : [{c:'#e65c00',hp:35}];
            let t = types[Math.floor(Math.random()*types.length)];
            enemies.push({x:Math.random()*w, y:Math.random()*h, r:13, hp:t.hp, mHp:t.hp, s:isDungeon?1.5:1.1, c:t.c});
        }, 1200);
                 function loop(){
            t++;
            if(p.eCd>0){p.eCd--; document.getElementById('ec').innerText=Math.ceil(p.eCd/60)+'s';}else document.getElementById('ec').innerText='';
            document.getElementById('q').style.background = p.energy>=p.mEnergy ? 'rgba(0,255,204,0.6)' : 'rgba(0,0,0,0.6)';

            if(mv.x||mv.y){
                p.x=Math.max(p.r,Math.min(w-p.r,p.x+mv.x*p.s)); p.y=Math.max(p.r,Math.min(h-p.r,p.y+mv.y*p.s));
                let l=Math.hypot(mv.x,mv.y); p.dx=mv.x/l; p.dy=mv.y/l;
            }
            if(p.aCd>0)p.aCd--;

            if(!isDungeon && Math.hypot(p.x-statue.x, p.y-statue.y) < statue.r+p.r) {
                if(p.hp < p.mHp) { p.hp = Math.min(p.mHp, p.hp+0.5); if(t%20===0) pt(p.x,p.y,'#66bb6a',4); }
            }

            if(Math.hypot(p.x-dungeonPortal.x, p.y-dungeonPortal.y) < dungeonPortal.r) {
                isDungeon = !isDungeon;
                p.x = w/2; p.y = h - 100;
                enemies.length = 0; items.length = 0; vortexes.length = 0;
                initMap();
                dmg(p.x, p.y-40, isDungeon ? "Вход в Подземелье" : "Тейват", "#fff");
                p.x += 50;
            }

            for(let i=vortexes.length-1;i>=0;i--){
                let v = vortexes[i];
                if(v.vx) { v.x+=v.vx; v.y+=v.vy; if(v.x<0||v.x>w)v.vx*=-1; if(v.y<0||v.y>h)v.vy*=-1; }
                
                enemies.forEach(e=>{
                    let d = Math.hypot(e.x-v.x, e.y-v.y);
                    if(d < v.r) {
                        if(v.pull) { let a=Math.atan2(v.y-e.y,v.x-e.x); e.x+=Math.cos(a)*1.5; e.y+=Math.sin(a)*1.5; }
                        if(t%15===0) { e.hp -= (3+p.wl); dmg(e.x,e.y-10,3+p.wl,'#00ffcc'); }
                    }
                });
                v.duration--; if(v.duration<=0) vortexes.splice(i,1);
            }

            for(let i=enemies.length-1;i>=0;i--){
                let e=enemies[i], a=Math.atan2(p.y-e.y,p.x-e.x);
                e.x+=Math.cos(a)*e.s; e.y+=Math.sin(a)*e.s;
                
                if(Math.hypot(p.x-e.x,p.y-e.y)<p.r+e.r){
                    p.hp=Math.max(0,p.hp-(isDungeon?0.4:0.2));
                    if(Math.random()<0.04)dmg(p.x,p.y-15,isDungeon?3:1,'#ff3333');
                }
                if(e.hp<=0){
                    pt(e.x,e.y,e.c,8);
                    if(Math.random()>0.3) items.push({x:e.x, y:e.y, t:'ore'});
                    enemies.splice(i,1);
                }
            }

            for(let i=items.length-1;i>=0;i--){
                let it = items[i];
                if(Math.hypot(p.x-it.x, p.y-it.y) < p.r+10) {
                    p.ore++;
                    document.getElementById('wcost').innerText = `⚡ Улучшить (${p.ore}/${p.wl*5} Руды)`;
                    items.splice(i,1);
                }
            }

            ctx.fillStyle = isDungeon ? '#2b2d42' : '#4b7055'; ctx.fillRect(0,0,w,h);

            if(!isDungeon) {
                ctx.fillStyle='#457b9d'; ctx.beginPath(); ctx.arc(statue.x,statue.y,statue.r,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#a8dadc'; ctx.beginPath(); ctx.arc(statue.x,statue.y,12,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#3d348b'; ctx.beginPath(); ctx.arc(dungeonPortal.x,dungeonPortal.y,dungeonPortal.r,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#f72585'; ctx.beginPath(); ctx.arc(dungeonPortal.x,dungeonPortal.y,dungeonPortal.r-8,0,Math.PI*2); ctx.fill();
            }

            env.forEach(o=>{ctx.fillStyle=o.t==='t'?'#274e13':'#666';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();});

            vortexes.forEach(v=>{
                ctx.fillStyle=v.c; ctx.beginPath(); ctx.arc(v.x,v.y,v.r,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle='#00ffcc'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(v.x,v.y,v.r*(0.3+Math.sin(t*0.05)*0.2),0,Math.PI*2); ctx.stroke();
            });

            items.forEach(it=>{ ctx.fillStyle='#00b4d8'; ctx.fillRect(it.x-4,it.y-4,8,8); });

            for(let i=parts.length-1;i>=0;i--){
                let pt=parts[i]; pt.x+=pt.vx; pt.y+=pt.vy; pt.a-=0.04;
                if(pt.a<=0)parts.splice(i,1);else{ctx.globalAlpha=pt.a;ctx.fillStyle=pt.c;ctx.fillRect(pt.x,pt.y,3,3);}
            }
            ctx.globalAlpha=1;

            enemies.forEach(e=>{
                ctx.fillStyle=e.c; ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#fff'; ctx.fillRect(e.x-3,e.y-2,2,2); ctx.fillRect(e.x+2,e.y-2,2,2);
                ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(e.x-12,e.y-e.r-6,24,3);
                ctx.fillStyle='#ff3333'; ctx.fillRect(e.x-12,e.y-e.r-6,(e.hp/e.mHp)*24,3);
            });

            if(p.hp>0){
                ctx.fillStyle='#9e2a2b'; ctx.beginPath();
                let wf = Math.sin(t*0.25)*4;
                ctx.arc(p.x-p.dx*12+wf, p.y-p.dy*12+wf, 9, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle='#eae0d5'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#d3bc8e'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,Math.atan2(p.dy,p.dx)-0.4,Math.atan2(p.dy,p.dx)+0.4); ctx.lineTo(p.x,p.y); ctx.fill();

                ctx.fillStyle='#f4d068'; ctx.beginPath(); ctx.arc(p.x-p.dx*3,p.y-p.dy*3,p.r-2,0,Math.PI*2); ctx.fill();
                
                let pSize = 3 + (p.energy/p.mEnergy)*3 + Math.sin(t*0.1)*1;
                ctx.fillStyle='#00ffcc'; ctx.beginPath(); ctx.arc(p.x+p.dx*8,p.y+p.dy*8,pSize,0,Math.PI*2); ctx.fill();
                
                ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(p.x-15,p.y-24,30,3);
                ctx.fillStyle='#5eff6b'; ctx.fillRect(p.x-15,p.y-24,(p.hp/p.mHp)*30,3);
                
                ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(p.x-15,p.y-20,30,2);
                ctx.fillStyle='#00ffcc'; ctx.fillRect(p.x-15,p.y-20,(p.energy/p.mEnergy)*30,2);
            }

            for(let i=dmgs.length-1;i>=0;i--){
                let d=dmgs[i]; d.y-=0.8; d.a-=0.025;
                if(d.a<=0)dmgs.splice(i,1);else{ctx.globalAlpha=d.a;ctx.fillStyle=d.c;ctx.font="bold 13px sans-serif";ctx.fillText(d.v,d.x,d.y);}
            }
            ctx.globalAlpha=1;

            if(joy.a){
                ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.arc(joy.sx,joy.sy,joy.r,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='rgba(211,188,142,0.5)'; ctx.beginPath(); ctx.arc(joy.cx,joy.cy,15,0,Math.PI*2); ctx.fill();
            }

            if(p.hp<=0){
                ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.fillRect(0,0,w,h);
                ctx.fillStyle='#fff'; ctx.font="16px sans-serif"; ctx.textAlign="center";
                ctx.fillText("Статуя Семи воскрешает Путешественника...",w/2,h/2);
                setTimeout(()=>{p.hp=100; p.energy=0; p.x=statue.x; p.y=statue.y+40; enemies.length=0; isDungeon=false; initMap();},2500);
                return;
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
